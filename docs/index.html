<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2b0908">
    <title>Apogée</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #2b0908; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center;
             font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #ffeecb; }
      /* The canvas keeps the game's portrait ratio and fills as much as it can. */
      #wrap { position: relative; height: 100%; aspect-ratio: 540 / 960; max-width: 100%; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: 14px; text-align: center; }
      #bar { width: 60%; height: 8px; border: 1px solid #f5c25c; border-radius: 6px; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #c22a1a; }
      #title { letter-spacing: .28em; font-size: 20px; }
      #hint { font-size: 13px; opacity: .75; max-width: 80%; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas>
      <div id="loading">
        <div id="title">APOGÉE</div>
        <div id="bar"><div id="fill"></div></div>
        <div id="hint">Chargement…</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fill = document.querySelector("#fill");
      var loading = document.querySelector("#loading");
      var hint = document.querySelector("#hint");
      var config = {
        dataUrl: "Build/WebBuild.data.unityweb",
        frameworkUrl: "Build/WebBuild.framework.js.unityweb",
        codeUrl: "Build/WebBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Apogée",
        productVersion: "5.1.1",
      };
      var script = document.createElement("script");
      script.src = "Build/WebBuild.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          hint.textContent = message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
